# Publishes every component from main and deploys it to ahorro-dev.
#
#   push to main        0.2.1-main.<short-sha>
#
# Cutting a release is release.yml, a separate button. This file is named for
# what it does that the other one does not: it reaches the cluster. See
# docs/adr/0010 for why the pipeline deploys at all, and docs/adr/0011 for
# why the two channels are two files.
#
# Every action is pinned to a full commit SHA; see ci.yml for why.
name: deploy

on:
  push:
    branches: [main]
    # gitops/** is ignored because it holds the pins, not the code. Publishing
    # a new version in answer to a pin change would mean the pin is already
    # stale the moment it merges.
    paths-ignore:
      - "gitops/**"
      - "docs/**"
      - "specs/**"

permissions: {}

# The same group as release.yml, deliberately: a release and a merge both push
# to GHCR under one version scheme, so they queue rather than race.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One version for the whole run, and the decision of what to rebuild.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      go: ${{ steps.filter.outputs.go }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      # The version is derived from the tag history, so fetch all of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: v
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh main "${{ github.sha }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Version \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      # Only what changed is rebuilt. Everything else is copied to the new tag.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'deploy/docker/ahorro-api.Dockerfile'
            flutter:
              - 'flutter-ui/**'
              - 'Makefile'
              - 'scripts/android-keystore-restore.sh'
              - 'deploy/docker/ahorro-web.Dockerfile'
              - 'deploy/docker/ahorro-web.nginx.conf'
              - 'deploy/docker/ahorro-web.Dockerfile.dockerignore'

  publish:
    needs: version
    permissions:
      contents: read
      packages: write
    # inherit passes nothing beyond the workflow token: this repository holds
    # no repository-level secrets, and the four signing secrets are scoped to
    # Environments, which a job without an `environment:` cannot reach.
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      go: ${{ needs.version.outputs.go }}
      flutter: ${{ needs.version.outputs.flutter }}

  # An installable build of this merge, for a phone. It points at ahorro-dev,
  # which deploy-dev has just upgraded to the same version, and it is signed
  # with the real upload key so it replaces whatever is on the device rather
  # than failing on a signature mismatch.
  artifacts-android:
    needs: version
    if: needs.version.outputs.flutter == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mobile-android.yml
    secrets: inherit
    with:
      env: dev
      environment: mobile-dev
      version: ${{ needs.version.outputs.version }}
      retention_days: 30

  # Namespace ahorro-dev only. Namespace ahorro is Argo's, pinned to a
  # released version, and the credential below is refused there by cluster
  # RBAC rather than by any condition in this file.
  deploy-dev:
    needs: [version, publish]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      # The lab is torn down when it is not in use, so an unreachable cluster
      # is the normal state rather than a failure. Exit 2 from the script
      # means exactly that, and it is reported loudly and left green: a red
      # run on every merge would train everyone to ignore the colour. Any
      # other failure is a real one and fails the job.
      - name: Deploy to ahorro-dev
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail
          # The script, not `make deploy-dev`: make collapses every recipe
          # failure to exit 2, which is the very code that means "unreachable"
          # here. Going through make would report a broken deploy as a skip
          # and leave the job green.
          PROJECT_NAME="$(make -s print-project)"
          export PROJECT_NAME
          # `|| status=$?`, because the default shell is `bash -e`: a bare call
          # would abort the step on any non-zero exit and the branches below
          # would never run.
          status=0
          ./scripts/deploy-dev.sh "$VERSION" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "### ahorro-dev is at \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" -eq 2 ]; then
            {
              echo "### ahorro-dev was not updated"
              echo
              echo "The cluster is not reachable, so this merge published"
              echo "\`$VERSION\` but deployed nothing."
              echo
              echo "Run 'make up' in vk-lab-platform, then re-run this job."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::ahorro-dev was not updated: the cluster is not reachable. Run 'make up' in vk-lab-platform, then re-run this job."
            exit 0
          fi
          exit "$status"
