# Push to main builds and pushes every image. Spec 040 adds the chart push
# and spec 060 adds the commit of the new SHA into gitops/values.yaml, which
# is why gitops/** is already ignored here.
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "gitops/**"
      - "docs/**"
      - "specs/**"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The docker-container driver is what makes a multi-platform build
      # possible; the default builder cannot produce one.
      - uses: docker/setup-buildx-action@v3

      - id: hello
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/hello.Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ghcr.io/${{ github.repository }}/hello:${{ github.sha }}

      - name: Report the digests
        env:
          HELLO_REF: ghcr.io/${{ github.repository }}/hello@${{ steps.hello.outputs.digest }}
        run: |
          {
            echo "### Images"
            echo '```'
            echo "$HELLO_REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
