# Push to main builds and pushes every image, then packages and pushes every
# chart. gitops/** is ignored so an edit to the app-of-apps values never
# rebuilds an image that did not change.
#
# Every action is pinned to a full commit SHA; see ci.yml for why.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "gitops/**"
      - "docs/**"
      - "specs/**"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One job per service, so a slow Flutter build never delays the Go image
    # and a failure names the service that broke.
    strategy:
      fail-fast: false
      matrix:
        svc: [ahorro-api, ahorro-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The docker-container driver is what makes a multi-platform build
      # possible; the default builder cannot produce one.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GitOps pins the moving ref name today, and the SHA tag is what makes a
      # rollback possible; `latest` is still never built.
      - name: Build the tag list
        id: tags
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository }}/${{ matrix.svc }}"
          {
            echo "list<<EOF"
            echo "$repo:${{ github.sha }}"
            echo "$repo:${{ github.ref_name }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # provenance: false keeps the pushed manifest a plain multi-platform
      # index rather than an attestation index, which is what Argo and a plain
      # docker pull expect.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.svc }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}

      - name: Report the digests
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/${{ matrix.svc }}@${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image ${{ matrix.svc }}"
            echo '```'
            echo "$IMAGE_REF"
            echo "${{ steps.tags.outputs.list }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A separate job, so a chart failure does not hide a successful image push.
  charts:
    needs: images
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Package and push every chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io \
            --username '${{ github.actor }}' --password-stdin
          {
            echo "### Charts"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in deploy/helm/*/; do
            chart="$(basename "${dir%/}")"
            make helm-push CHART="$chart"
            version="$(sed -n 's/^version: *//p' "$dir/Chart.yaml")"
            echo "oci://ghcr.io/${{ github.repository }}/charts/$chart:$version" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
