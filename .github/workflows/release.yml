# Push to main builds and pushes every image. Spec 040 adds the chart push
# and spec 060 adds the commit of the new SHA into gitops/values.yaml, which
# is why gitops/** is already ignored here.
#
# Every action is pinned to a full commit SHA; see ci.yml for why.
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "gitops/**"
      - "docs/**"
      - "specs/**"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The docker-container driver is what makes a multi-platform build
      # possible; the default builder cannot produce one.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # provenance: false keeps the pushed manifest a plain multi-platform
      # index rather than an attestation index, which is what Argo and a plain
      # docker pull expect.
      - id: hello
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/hello.Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ghcr.io/${{ github.repository }}/hello:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digests
        env:
          HELLO_REF: ghcr.io/${{ github.repository }}/hello@${{ steps.hello.outputs.digest }}
        run: |
          {
            echo "### Images"
            echo '```'
            echo "$HELLO_REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
