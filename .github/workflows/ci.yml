# Pull-request gate.
#
# Every action is pinned to a full commit SHA. A tag can be moved; the 2025
# tj-actions and 2026 trivy-action attacks both did exactly that to read
# secrets out of other people's pipelines.
name: ci

on:
  pull_request:

permissions: {}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ci-go-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: make go-build

      - run: make go-test

      # The version matches the one developers run locally.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ci-image-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build both architectures without pushing, so a broken Dockerfile fails
      # the pull request instead of the release.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/hello.Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ci-ui-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - run: make ui-get

      - run: make ui-analyze

      - run: make ui-test

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-helm-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      # The version check diffs against the base commit, so it needs history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - run: make helm-lint

      # No -ignore-missing-schemas: HTTPRoute is the only custom resource here
      # and the catalog carries it, so a missing schema is a real failure.
      - name: Render and validate every chart
        run: |
          set -euo pipefail
          for dir in deploy/helm/*/; do
            chart="$(basename "${dir%/}")"
            make helm-template CHART="$chart"
          done > rendered.yaml
          kubeconform -summary -strict \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml

      - run: ./scripts/chart-version-check.sh "origin/${{ github.base_ref }}"

  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ci-repo-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      # The domain guard reads every commit, so it needs the whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: make specs-check

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      # The parameter is the one delivery path for this value, written by the
      # platform from its KMS ciphertext. An SSM value is not masked the way a
      # GitHub secret is, so register the mask before anything can print it.
      - name: Read the root domain
        run: |
          value="$(aws ssm get-parameter --name /account/root_domain \
            --query Parameter.Value --output text)"
          echo "::add-mask::$value"
          echo "ROOT_DOMAIN=$value" >> "$GITHUB_ENV"

      # Fails closed: no role, no parameter, no green.
      - run: make domain-check
