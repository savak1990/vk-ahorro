# Pull-request gate. Later specs add their own steps here: helm lint (040),
# terraform fmt -check (050), flutter analyze and flutter test (070, 090).
#
# Every action is pinned to a full commit SHA. A tag can be moved; the 2025
# tj-actions and 2026 trivy-action attacks both did exactly that to read
# secrets out of other people's pipelines.
name: ci

on:
  pull_request:

permissions: {}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ci-go-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: make go-build

      - run: make go-test

      # The version matches the one developers run locally.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ci-image-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build both architectures without pushing, so a broken Dockerfile fails
      # the pull request instead of the release.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/hello.Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-repo-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      # The domain guard reads every commit, so it needs the whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: make specs-check

      # Fails closed when the secret is missing: an unset domain must never
      # look like a clean result.
      - run: make domain-check
        env:
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
