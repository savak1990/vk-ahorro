# Set by the platform's pointer Application. fqdn is sensitive and is never
# committed; the Cognito identifiers are public but are one pool per platform
# project, so a committed value would be right for exactly one project.
fqdn: ""

# Which platform target is rendering this chart. Only "local" changes the
# shape: no public hostname, no gateway route and no user pool, so the chart
# cannot infer any of it from an empty fqdn.
target: aws

namespace: ahorro

# Where `make ui-run-web` serves the Flutter client, which the API must accept
# as a CORS origin or the browser throws every answer away. It matches
# --web-port in the Makefile, and it is not the local target's 8090 below:
# that one is a kubectl port-forward of a built image, this one is the dev
# server a developer runs against any backend.
devServerPort: 3000

charts:
  # The bare registry form, not oci://. That is the form the platform's own
  # OCI Application already uses and the one proven to sync here.
  registry: ghcr.io/savak1990/vk-ahorro/charts

cognito:
  clientId: ""
  issuer: ""
  userPoolId: ""
  # The fallback only. The platform publishes the pool's own region beside the
  # other three identifiers and overrides this; it is left here so a target
  # with no pool to read - local - still renders a usable client.
  region: eu-west-1

# The local target only. Both services are reached through kubectl
# port-forward, so the browser origin and the API base URL are localhost and
# the two ports are part of the delivered configuration, not a local choice.
#
# 8090 and 8091 rather than 8080: the platform's own `make forward-up` puts
# the gateway on 8080 and refuses to start when that port is held.
local:
  webPort: 8090
  apiPort: 8091
  # Stands in for a Cognito user. The address matches the pool's test user on
  # the cloud targets and can never receive mail.
  userEmail: e2e@vk-ahorro.invalid
  userSub: "00000000-0000-0000-0000-000000000000"

# One Argo Application per backend service. Adding a service is four lines
# here and no new template; every Go service takes the same parameter shape.
#
# Every component sits at one released version, and the chart version and the
# image tag are the same string. This is the baseline a cluster recreate
# returns to, so it moves only when a human promotes a release here.
#
# Never a range and never a moving tag. Argo resolves a chart version with
# Masterminds/semver, and no constraint matches a prerelease - "*" would stop
# seeing new builds while still reporting Synced. A moving tag leaves the
# rendered manifest unchanged, so Argo creates no pod at all.
services:
  ahorro-api:
    chartVersion: "0.2.1"
    tag: "0.2.1"
    hostPrefix: api-ahorro
    wave: 1

web:
  chartVersion: "0.2.1"
  tag: "0.2.1"
  hostPrefix: ahorro
  wave: 2
