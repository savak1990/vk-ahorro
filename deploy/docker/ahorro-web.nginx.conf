server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    # nginx below 1.29.1 does not ship this type, and without it the browser
    # refuses to stream-compile the CanvasKit module.
    types { application/wasm wasm; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               application/wasm image/svg+xml application/manifest+json;

    # Content-hashed, so they can never go stale. =404 rather than the SPA
    # fallback below: a cached shell asking for a deleted hash would otherwise
    # be handed index.html with the wrong Content-Type for a script.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /canvaskit/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The three files a deploy must never serve from cache: the shell names
    # the new asset hashes, and config.json names the environment.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
